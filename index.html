<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Offline | Em Manutenção</title>
    <style>
        :root {
            --bg-color: #0b0914;
            --card-bg: rgba(22, 17, 39, 0.7);
            --primary-purple: #9d4edd;
            --accent-purple: #c77dff;
            --glow-color: rgba(157, 78, 221, 0.4);
            --text-primary: #f8f9fa;
            --text-secondary: #adbac7;
            --border-color: rgba(157, 78, 221, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Elements for ambient background lighting */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(123, 44, 191, 0.25) 0%, rgba(11, 9, 20, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(157, 78, 221, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(157, 78, 221, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        /* Container Card */
        .container {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 540px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(157, 78, 221, 0.15);
        }

        /* Status Icon / Visual */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(157, 78, 221, 0.12);
            border: 1px solid rgba(199, 125, 255, 0.3);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent-purple);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4d4d;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff4d4d;
        }

        .icon-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.5rem auto;
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.2), rgba(60, 9, 108, 0.4));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px var(--glow-color);
        }

        .icon-wrapper svg {
            width: 44px;
            height: 44px;
            stroke: var(--accent-purple);
        }

        /* Typography */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Interactive Elements */
        .btn-refresh {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 28px;
            background: linear-gradient(135deg, #7b2cbf 0%, #5a189a 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
            text-decoration: none;
        }

        .btn-refresh:hover {
            background: linear-gradient(135deg, #9d4edd 0%, #7b2cbf 100%);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
            transform: translateY(-2px);
        }

        .btn-refresh svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            transition: transform 0.3s ease;
        }

        .btn-refresh:hover svg {
            transform: rotate(180deg);
        }

        /* Footer Info inside Card */
        .system-status {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: rgba(173, 186, 197, 0.6);
        }

        .system-status span strong {
            color: var(--text-secondary);
        }

        /* Responsive tweaks */
        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 1.75rem;
            }
            .system-status {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="grid-overlay"></div>

    <main class="container">
        <div class="status-badge">
            <span class="status-dot"></span> Servidor Offline
        </div>

        <div class="icon-wrapper">
            <!-- Wifi Off Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>

        <h1>Estamos Fora do Ar</h1>
        
        <p>
            Nossa página está temporariamente indisponível para manutenção programada e melhorias no sistema. Volte em breve!
        </p>

        <button class="btn-refresh" onclick="window.location.reload();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"></path>
                <path d="M1 20v-6h6"></path>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Tentar Novamente
        </button>

        <div class="system-status">
            <span>Previsão: <strong>Em breve</strong></span>
            <span>Código: <strong>503 Service Unavailable</strong></span>
        </div>
    </main>

</body>
</html>
