name: Gerar APK do Site

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Converter Site em APK
        uses: darkshredder/web-to-app-action@v1
        with:
          app-name: "MeuAplicativo"
          build-folder-path: "./"

      - name: Salvar o APK gerado (Corrigido para v4)
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-apk
          path: apk/
